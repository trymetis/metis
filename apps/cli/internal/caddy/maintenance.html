<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Down for maintenance</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #fafafa;
        color: #171717;
      }
      main {
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }
      p {
        margin: 6px 0 0;
        font-size: 14px;
        color: #737373;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #f5f5f5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Down for maintenance</h1>
      <p><span id="down" hidden></span>Since {{.Since}}.</p>
      <p>
        This page reloads by itself when the app is back. Contact your administrator if this takes
        longer than expected.
      </p>
    </main>
    <script>
      (function () {
        var since = Date.parse({{.SinceISO}});
        var down = document.getElementById("down");
        function show() {
          var minutes = Math.floor((Date.now() - since) / 60000);
          var days = Math.floor(minutes / 1440);
          var hours = Math.floor((minutes % 1440) / 60);
          var rest = minutes % 60;
          var text =
            minutes < 1
              ? "less than a minute"
              : days > 0
                ? days + " d" + (hours > 0 ? " " + hours + " h" : "")
                : hours > 0
                  ? hours + " h" + (rest > 0 ? " " + rest + " min" : "")
                  : rest + " min";
          down.textContent = "Down for " + text + ". ";
          down.hidden = false;
        }
        show();
        setInterval(show, 30000);
        setInterval(function () {
          fetch(location.href, {
            headers: { Accept: "application/json" },
            cache: "no-store",
            redirect: "manual",
          }).then(
            function (response) {
              var current = response.headers.get("Metis-Maintenance");
              if (current === null || Date.parse(current) !== since) location.reload();
            },
            function () {},
          );
        }, 30000);
      })();
    </script>
  </body>
</html>
