dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap submission lmtp
listen = *
hostname = demo.trymetis.email
base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout

auth_allow_cleartext = yes
auth_username_format = %{user | username | lower}
ssl = no

import_environment {
  USER_PASSWORD = %{env:USER_PASSWORD | default('{CRYPT}*')}
}

passdb static {
  password = %{env:USER_PASSWORD}
}

mail_utf8_extensions = yes
mail_driver = maildir
mail_path = ~/mail
mail_home = /srv/vmail/%{user | lower}
mail_uid = vmail
mail_gid = vmail

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Archive {
    special_use = \Archive
  }
}

submission_relay_host = 127.0.0.1
submission_relay_port = 25
submission_relay_trusted = yes
submission_relay_ssl = no
submission_max_mail_size = 100M

service imap-login {
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 0
  }
}

service submission-login {
  inet_listener submission {
    port = 31587
  }
  inet_listener submissions {
    port = 0
  }
}

service lmtp {
  inet_listener lmtp {
    port = 31024
  }
}
