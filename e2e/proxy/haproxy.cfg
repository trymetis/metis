global
  log stdout format raw local0 warning

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  default-server init-addr last,libc,none resolvers docker

listen app
  bind :3000
  server app app:3000

listen replay
  bind :8099
  server replay replay:8080

listen mcp-client
  bind :8098
  server mcp-client mcp-client:8080

listen updater
  bind :8097
  server updater updater:8080

listen s3
  bind :9000
  server s3 s3:9000

listen caldav
  bind :5232
  server caldav caldav:5232

listen webdav
  bind :6065
  server webdav webdav:6065

listen imap
  bind :31143
  server mail mail:31143

listen submission
  bind :31587
  server mail mail:31587

listen ftp
  bind :2121
  server ftp ftp:21

listen ftps-implicit
  bind :2990
  server ftp ftp:990

listen ftp-passive
  bind :30000-30019
  server ftp ftp

listen sftp
  bind :2222
  server sftp sftp:22

listen gateway-cloudflare
  bind :8787
  server gateway-cloudflare gateway-cloudflare:8787

listen gateway-resend
  bind :8788 ssl crt /usr/local/etc/haproxy/resend-gateway.pem
  server gateway-resend gateway-resend:8787

listen srh
  bind :8079
  server srh srh:80

listen resend-control
  bind :8096
  server resend resend:8080
