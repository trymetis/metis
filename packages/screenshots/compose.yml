services:
  seed:
    environment:
      E2E_EDGE: "0"
  preflight:
    environment:
      METIS_WORKFLOW_CADENCE_SEC: "60"
  fakes:
    environment:
      FAKES: resend,ses,mcp-client,updater
  claude-code:
    build:
      context: ../packages/screenshots
      dockerfile: claude-code.Dockerfile
    container_name: metis-claude-code
    network_mode: host
    init: true
