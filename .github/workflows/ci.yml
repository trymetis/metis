name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Release files match the changelogs
        run: bun run release:check

      - name: Shell core tests
        run: bun run --cwd packages/shell-core test

      - name: Migrations match the schema
        run: bun run db:check

  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [apps/cli, e2e/fakes]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
