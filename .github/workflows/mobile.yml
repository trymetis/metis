name: Mobile app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'mobile-v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the mobile app version
        id: release
        run: .github/scripts/release-version.sh mobile-v apps/mobile/app.json .expo.version

      - name: Check the changelog has this release
        if: steps.release.outputs.version != ''
        run: .github/scripts/changelog-section.sh apps/mobile/CHANGELOG.md "${{ steps.release.outputs.version }}" > /dev/null

  build:
    name: universal-linux-android
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Sign with the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          mkdir out
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out out/metis-suite-universal-linux-android.apk \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs out/metis-suite-universal-linux-android.apk
          rm "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-universal-linux-android
          path: out/*
          if-no-files-found: error

      - name: Build the release bundle with the Play upload key
        working-directory: apps/mobile/android
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_METIS_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_METIS_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_METIS_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          export ORG_GRADLE_PROJECT_METIS_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$ORG_GRADLE_PROJECT_METIS_UPLOAD_STORE_FILE"
          ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          bundle=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle" | grep -qx 'jar verified.'
          signers=$(keytool -printcert -jarfile "$bundle" | awk '/SHA256:/ {print $2}')
          upload=$(keytool -list -v -keystore "$ORG_GRADLE_PROJECT_METIS_UPLOAD_STORE_FILE" \
            -alias "$ORG_GRADLE_PROJECT_METIS_UPLOAD_KEY_ALIAS" \
            -storepass:env ORG_GRADLE_PROJECT_METIS_UPLOAD_STORE_PASSWORD | awk '/SHA256:/ {print $2}')
          rm "$ORG_GRADLE_PROJECT_METIS_UPLOAD_STORE_FILE"
          if [[ -z "$upload" || "$signers" != "$upload" ]]; then
            echo "::error::the bundle's signer is not only the Play upload key"
            exit 1
          fi
          mkdir "$GITHUB_WORKSPACE/play"
          cp "$bundle" "$GITHUB_WORKSPACE/play/metis-suite.aab"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: play/metis-suite.aab
          if-no-files-found: error

  play:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: play-bundle
          path: ${{ runner.temp }}/play

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: email.trymetis.suite
          releaseFiles: ${{ runner.temp }}/play/metis-suite.aab
          tracks: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  publish:
    needs: [release, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mobile-*
          path: out
          merge-multiple: true

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.DOWNLOADS_R2_BUCKET }}
          VERSION: ${{ needs.release.outputs.version }}
          LATEST: ${{ needs.release.outputs.latest }}
          CHANGELOG: apps/mobile/CHANGELOG.md
          VERSION_MANIFEST: true
        run: |
          .github/scripts/r2-upload.sh out "mobile/v$VERSION/" mobile/latest/ \
            metis-suite-universal-linux-android.apk
