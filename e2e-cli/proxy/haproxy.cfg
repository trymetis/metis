global
  log stdout format raw local0 warning

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

crt-store e2e
  crt-base /usr/local/etc/haproxy/tls
  key-base /usr/local/etc/haproxy/tls
  load crt resend-gateway/cert.crt key resend-gateway/cert.key alias resend-gateway
  load crt ses-gateway/cert.crt key ses-gateway/cert.key alias ses-gateway
  load crt s3-amazonaws/cert.crt key s3-amazonaws/cert.key alias s3-amazonaws

defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  default-server init-addr last,libc,none resolvers docker

listen app
  bind :3000
  server cli-host cli-host:3100

listen registry
  bind :5443
  server fakes fakes:443

listen ttyd
  bind :7681
  server cli-host cli-host:7681

listen fakes-control
  bind :8090
  server fakes fakes:8080

listen replay
  bind :8099
  server replay replay:8080

listen s3
  bind :9000
  server s3 s3:9000

listen caldav
  bind :5232
  server caldav caldav:5232

listen webdav
  bind :6065
  server webdav webdav:6065

listen imap
  bind :31143
  server mail mail:31143

listen submission
  bind :31587
  server mail mail:31587

listen ftp
  bind :2121
  server ftp ftp:21

listen ftps-implicit
  bind :2990
  server ftp ftp:990

listen ftp-passive
  bind :30000-30019
  server ftp ftp

listen sftp
  bind :2222
  server sftp sftp:22

listen gateway-cloudflare
  bind :8787
  server gateway-cloudflare gateway-cloudflare:8787

listen gateway-resend
  bind :8788 ssl crt @e2e/resend-gateway
  server gateway-resend gateway-resend:8787

listen gateway-ses
  bind :8789 ssl crt @e2e/ses-gateway
  server fakes fakes:8081

listen s3-amazonaws
  bind :443 ssl crt @e2e/s3-amazonaws
  server s3 s3:9000

listen srh
  bind :8079
  server srh srh:80

